name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json;print(json.load(open('custom_components/pstryk_osd_compare/manifest.json'))['version'])")
          test "$tag" = "$ver" || { echo "tag $tag != manifest $ver"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
